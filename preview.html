<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriRotina — Preview (Mobile + Desktop)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f5f5 0%, #efefef 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .preview-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            max-width: 1400px;
            width: 100%;
        }

        .preview-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .preview-label {
            font-size: 16px;
            font-weight: 600;
            color: #6b6b6b;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .mobile-frame {
            position: relative;
            width: 390px;
            height: 844px;
            border: 12px solid #000;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            background: white;
        }

        .mobile-frame::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 25px;
            background: #000;
            border-radius: 0 0 20px 20px;
            z-index: 10;
        }

        .mobile-frame iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .desktop-frame {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 700px;
            border: 1px solid #ddd;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            background: white;
        }

        .desktop-frame iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        @media (max-width: 1200px) {
            .preview-container {
                grid-template-columns: 1fr;
            }
        }

        .info-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #e88ba3;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            font-size: 14px;
            color: #6b6b6b;
            max-width: 100%;
            margin-bottom: 20px;
        }

        .info-box strong {
            color: #e88ba3;
        }
    </style>
</head>
<body>
    <div class="preview-container">
        <div class="preview-section">
            <div class="info-box">
                <strong>📱 Mobile (iPhone)</strong><br>
                Fase 1: Timeline visual com cores por categoria
            </div>
            <div class="preview-label">Mobile</div>
            <div class="mobile-frame">
                <iframe src="index.html"></iframe>
            </div>
        </div>

        <div class="preview-section">
            <div class="info-box">
                <strong>🖥️ Desktop (Computador)</strong><br>
                O app se adapta para telas maiores
            </div>
            <div class="preview-label">Desktop</div>
            <div class="desktop-frame">
                <iframe src="index.html"></iframe>
            </div>
        </div>
    </div>
</body>
</html>
