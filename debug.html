<!DOCTYPE html>
<html>
<head>
    <title>Debug</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #f5f5f5; }
        .log { background: white; padding: 20px; margin: 10px 0; border-radius: 8px; border-left: 4px solid #e88ba3; }
        .error { border-left-color: red; color: red; }
        .success { border-left-color: green; color: green; }
    </style>
</head>
<body>
    <h1>🔍 Debug NutriRotina</h1>
    <div id="logs"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.0"></script>
    <script src="supabase-client.js"></script>
    <script src="auth-ui.js"></script>

    <script>
        const logsDiv = document.getElementById('logs');

        function log(msg, isError = false) {
            const div = document.createElement('div');
            div.className = 'log ' + (isError ? 'error' : 'success');
            div.textContent = msg;
            logsDiv.appendChild(div);
            console.log(msg);
        }

        setTimeout(async () => {
            log('✅ Página carregada');

            const user = await getCurrentUser();
            if (user) {
                log('✅ Usuário logado: ' + user.email);
                log('Verificando se NutriRotina vai inicializar...');

                setTimeout(() => {
                    if (typeof window.nutriRotina !== 'undefined') {
                        log('✅ NutriRotina inicializado!');
                    } else {
                        log('❌ NutriRotina NÃO inicializou', true);
                        log('Tentando inicializar manualmente...');

                        // Tenta carregar o app.js
                        const script = document.createElement('script');
                        script.src = 'app.js';
                        document.body.appendChild(script);

                        script.onload = () => {
                            log('✅ app.js carregado!');
                            setTimeout(() => {
                                if (typeof window.nutriRotina !== 'undefined') {
                                    log('✅ NutriRotina inicializado após carregar app.js!');
                                } else {
                                    log('❌ Ainda não funcionou', true);
                                }
                            }, 500);
                        };
                    }
                }, 1000);
            } else {
                log('❌ Usuário não logado', true);
            }
        }, 500);
    </script>
</body>
</html>
